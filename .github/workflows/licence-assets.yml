# Started by hand from the Actions tab, for two jobs that the workflow Release doesn't do:
# - build-inputs keeps copies of the source archives that the ports of the Samsung Emscripten SDK download during the
#   build and compile into the app (OpenSSL 1.1.1d, curl 7.68.0 and zlib 1.2.8, see docs/BUILD.md) in the release
#   build-inputs of this repository, after checking them against the SHA-512 checksums of the ports. The GPL-3.0 asks
#   that the source of the released packages stays available, and the servers of these projects may drop old archives.
# - old-release-notices attaches docs/licenses/THIRD-PARTY-NOTICES-before-2.2.txt and the GPL-3.0 text to the four
#   releases before 2.2.0, whose packages carry no licence texts. From 2.2.0 on, the package carries them itself.
# Both jobs can run again: they replace the files they uploaded before. Neither changes which release is the latest,
# which the in-app update check reads.
name: Licence and source assets
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'build-inputs: keep the source archives of the build; old-release-notices: attach the licence notices to the releases before 2.2.0'
        required: true
        type: choice
        options:
          - build-inputs
          - old-release-notices
jobs:
  build-inputs:
    if: inputs.task == 'build-inputs'
    runs-on: ubuntu-latest
    # contents: write creates the release build-inputs and uploads its files
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # The URLs and checksums of docs/BUILD.md, which come from tools/ports/tizen/crypto.py, ssl.py and curl.py and
      # tools/ports/zlib.py of the Samsung Emscripten SDK 1.39.4.7; a file that doesn't match stops the job
      - name: Download and check the source archives
        run: |
          set -euo pipefail
          mkdir -p build-inputs
          download() {
            curl -fsSL --retry 3 -o "build-inputs/$1" "$2"
            echo "$3  build-inputs/$1" | sha512sum -c -
          }
          download openssl-1.1.1d.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1d/openssl-1.1.1d.tar.gz \
            2bc9f528c27fe644308eb7603c992bac8740e9f0c3601a130af30c9ffebbf7e0f5c28b76a00bbb478bad40fbe89b4223a58d604001e1713da71ff4b7fe6a08a7
          download curl-7.68.0.tar.bz2 https://curl.se/download/curl-7.68.0.tar.bz2 \
            ad7390fd700cb74db356a39e842dab011823b87d4047687f2a8c2e0f2920a4f8c6c193ba56391489a75939cc5c39a4dccec4e4ceeac516eb7394f03e0fb7aeae
          download zlib-version_1.zip https://github.com/emscripten-ports/zlib/archive/version_1.zip \
            77f7d8f18fe11bb66a57e358325b7422d721f7b506bd63293cfde74079f958864db66ead5a36c311a76dd8c2b089b7659641a5522de650de0f9e6865782a60dd
          (cd build-inputs && sha512sum ./* > SHA512SUMS.txt && cat SHA512SUMS.txt)
      - name: Create or update the release build-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > build-inputs-notes.md <<'NOTES'
          Copies of the source archives that the ports of the Samsung Emscripten SDK 1.39.4.7 download while building Moonlight Plus, and compile into the app: OpenSSL 1.1.1d, curl 7.68.0 and zlib 1.2.8 (the version `version_1` of emscripten-ports/zlib). They are checked against the SHA-512 checksums of the ports (`SHA512SUMS.txt`). [docs/BUILD.md](${{ github.server_url }}/${{ github.repository }}/blob/HEAD/docs/BUILD.md) lists everything that the build downloads, and [THIRD-PARTY-NOTICES.txt](${{ github.server_url }}/${{ github.repository }}/blob/HEAD/wasm/static/licenses/THIRD-PARTY-NOTICES.txt) the licences.

          This is no version of the app: the app packages are in the releases named Moonlight Plus.
          NOTES
          if gh release view build-inputs > /dev/null 2>&1; then
            gh release upload build-inputs build-inputs/* --clobber
            gh release edit build-inputs --notes-file build-inputs-notes.md
          else
            gh release create build-inputs build-inputs/* --target "$GITHUB_SHA" --title "Build inputs: source archives of the libraries" \
              --notes-file build-inputs-notes.md --latest=false
          fi
          gh release view build-inputs --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[].name]}'
          # The in-app update check reads the latest release, which must stay a version of the app
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "Latest release: $latest"
          if [ "$latest" = "build-inputs" ]; then
            echo "The release build-inputs became the latest release."
            exit 1
          fi
  old-release-notices:
    if: inputs.task == 'old-release-notices'
    runs-on: ubuntu-latest
    # contents: write uploads the files to the releases
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Attach the licence notices to the releases before 2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p notices
          cp docs/licenses/THIRD-PARTY-NOTICES-before-2.2.txt notices/THIRD-PARTY-NOTICES.txt
          cp LICENSE notices/LICENSE.txt
          for tag in v1.19.0-s90c.1 v1.19.100 v1.19.101 v2.1.0; do
            gh release upload "$tag" notices/THIRD-PARTY-NOTICES.txt notices/LICENSE.txt --clobber
            gh release view "$tag" --json tagName,assets --jq '{tagName, assets: [.assets[].name]}'
          done
