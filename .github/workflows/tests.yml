# This workflow runs the tests of the app on every push and pull request: the ES2018 syntax, EM_ASM, locale and documentation link checks, the Node unit tests, the native tests with sanitizers and the browser tests in Chromium (see `tests/README.md`).
# It needs no build of the WebAssembly module, since the browser tests replace it with a stub and the native tests build single source files with g++. The full Docker build stays in the release workflows.
name: Tests
# Configure this workflow to be triggered by every push to any branch and by every pull request.
on:
  push:
  pull_request:
# By specifying the access of one of the scopes, all of those that are not specified are set to 'none'. The tests only read the repository.
permissions:
  contents: read
# Cancels a running test run of the same branch or pull request when a newer commit arrives, since only the latest result matters.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu, which provides g++ for the native tests.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every command runs in the `tests` folder, which holds the test tools and their pinned versions (`tests/package.json`).
    defaults:
      run:
        working-directory: tests
    # This job checks out the code, sets up Node.js with the pinned test tools and Chromium, and runs every test suite. Each suite also runs when an earlier suite failed, so that one run reports all failures, as long as the tools it needs were installed.
    steps:
      # This step uses the `actions/checkout` action to check out the repository's code so that it can be used in the workflow.
      - name: Checkout repository
        uses: actions/checkout@v7
      # This step uses the `actions/setup-node` action to set up Node.js 22, with the npm cache keyed on the lockfile of the test tools.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      # This step installs the exact versions of the test tools (Playwright and acorn) from `tests/package-lock.json`.
      - name: Install test tools
        id: tools
        run: npm ci
      # This step downloads the Chromium build that matches the installed Playwright version, with the system libraries it needs.
      - name: Install Chromium for Playwright
        id: chromium
        run: npx playwright install --with-deps chromium
      # This step checks that the scripts running on the TV stay within ES2018 (Chromium M69 on Tizen 5.5), that no EM_ASM block has a comma that Emscripten 1.39 can't handle, that the locale files are in sync and translated, and that the local links of the README and the documents exist.
      - name: Run the syntax, locale and link checks
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: npm run test:tools
      # This step runs the Node unit tests of the pure functions of the platform scripts.
      - name: Run the unit tests
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: npm run test:unit
      # This step builds the native gamepad tests with g++ and the address and undefined behaviour sanitizers, and runs them.
      - name: Run the native tests
        if: ${{ !cancelled() }}
        run: npm run test:native
      # This step serves the UI of the repository with simulated Tizen APIs and runs the Playwright tests in Chromium.
      - name: Run the browser tests
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:browser
