# This workflow builds a Docker image from the repository, pushes it to GitHub Container Registry, and then triggers a second job to extract an artifact and create a GitHub pre-release.
name: Release (Development)
# Configure this workflow to be triggered manually from the GitHub Actions tab for development-related branches.
# With `promote_tag`, it builds nothing and turns that pre-release into a full release instead (see the last job).
on:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Tag of a pre-release to turn into a full release with its files kept (leave empty to build a new pre-release)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'New tag of the full release, e.g. v1.19.0-s90c.1 (only used with promote_tag)'
        required: false
        default: ''
        type: string
# Queues the release runs of both workflows, because they push the ForceGM image to the same `:forcegm` tag, which an
# overlapping run would overwrite before the upload job of the other run pulls it (a package of another commit).
concurrency:
  group: moonlight-release-images
  cancel-in-progress: false
# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
# Defines two jobs. The first builds and pushes the Docker images, while the second extracts the artifacts and creates a GitHub pre-release.
jobs:
  build-and-push-image:
    if: github.ref != 'refs/heads/master' && inputs.promote_tag == ''
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      issues: write
      actions: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ github.sha }}
    # This job checks out the code, logs into GitHub Container Registry, builds the Docker image with metadata, pushes it to the registry, and triggers the next workflow via repository dispatch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Converts the image name to lowercase, because Docker rejects image tags with uppercase letters, which `github.repository` contains when the repository owner's name does.
      - name: Convert image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `build-args` parameter to define the `BUILD_TYPE` as "development" and injects the repository owner and name into the Docker build process. The `FORCE_GAME_MODE` argument is set to false, which builds the Standard variant without metadata injection at packaging time.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image (Standard variant)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `build-args` parameter to define the `BUILD_TYPE` as "development" and injects the repository owner and name into the Docker build process. The `FORCE_GAME_MODE` argument is set to true, which builds the ForceGM variant in the same tree with one metadata line injected at packaging time.
      # It uses the `tags` parameter to tag the image with the `REGISTRY` and lowercase `IMAGE_NAME`, and the `labels` parameter to label the image with the output from the "meta" step.
      - name: Build and push Docker image (ForceGM variant)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:forcegm
          labels: ${{ steps.meta.outputs.labels }}
  run-and-upload-release:
    if: github.ref != 'refs/heads/master' && inputs.promote_tag == ''
    runs-on: ubuntu-latest
    needs: build-and-push-image
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
      packages: read
      issues: write
      actions: write
    # This job depends on the completion of the build-and-push-image job. It checks out the repository, generates a timestamp, deletes any existing GitHub pre-releases from the same branch to avoid duplicates, extracts build artifacts from the Docker image, and creates a new GitHub pre-release with the extracted files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will run the container.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Generates a timestamp number from the current date and time for use in tagging and pre-release.
      - name: Generate timestamp number
        run: |
          TIMESTAMP=$(TZ="CET" date +"%Y.%m%d.%H%M")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
      # Extracts the branch name from the Git reference, replacing any slashes with dashes for compatibility in tagging and pre-release naming.
      - name: Extract branch name
        run: |
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
      # Sets up the image tags for the Standard and ForceGM variants, storing them in environment variables for use in subsequent steps.
      # The Standard variant tag is obtained from the output of the build-and-push-image job, while the ForceGM variant tag is constructed using the registry and image name (converted to lowercase), with the ":forcegm" suffix.
      - name: Set up image tags
        run: |
          echo "IMAGE_TAG=${{ needs.build-and-push-image.outputs.image_tag }}" >> $GITHUB_ENV
          echo "IMAGE_TAG_FORCEGM=${{ env.REGISTRY }}/${IMAGE_NAME,,}:forcegm" >> $GITHUB_ENV
      # Deletes any existing GitHub pre-releases from the same branch to avoid duplicates.
      - name: Check and delete any existing GitHub pre-releases from the same branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing pre-releases from branch: $BRANCH"
          releases=$(curl -sSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          dev_releases=$(echo "$releases" | jq -c ".[] | select(.prerelease==true and (.tag_name | contains(\"$BRANCH\")))")
          if [ -z "$dev_releases" ]; then
            echo "No pre-releases found for branch: $BRANCH"
          else
            echo "Found one or more pre-releases for branch: $BRANCH"
            echo "Starting cleanup..."
            echo "$dev_releases" | while read -r release; do
              release_id=$(echo "$release" | jq -r '.id')
              release_name=$(echo "$release" | jq -r '.name')
              tag_name=$(echo "$release" | jq -r '.tag_name')
              echo "Deleting pre-release: $release_name (ID: $release_id)"
              curl -sSL -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
              echo "Deleting tag reference: $tag_name"
              curl -sSL -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${tag_name}"
            done
            echo "Cleanup completed."
          fi
      # Runs the Docker containers in detached mode to extract the build artifacts.
      - name: Run Docker containers
        run: |
          docker run -d --name temp_container $IMAGE_TAG
          docker run -d --name temp_container_forcegm $IMAGE_TAG_FORCEGM
      # Copies the built widget files from the Docker containers.
      - name: Copy artifacts from Docker containers
        run: |
          docker cp temp_container:/home/moonlight/Moonlight.wgt .
          docker cp temp_container_forcegm:/home/moonlight/Moonlight-ForceGM.wgt .
      # Stops and removes the temporary Docker containers to clean up resources.
      - name: Stop and remove Docker containers
        run: |
          docker stop temp_container temp_container_forcegm
          docker rm temp_container temp_container_forcegm
      # Builds the description of the pre-release, with the release notes from `docs/RELEASE_NOTES_DEV.md` when the branch has them.
      - name: Prepare release notes
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "# Moonlight Tizen v${TIMESTAMP}"
            echo
            echo "- Ensure your setup meets the necessary [requirements](https://github.com/brightcraft/moonlight-tizen#%EF%B8%8F-prerequisites) for the best possible streaming experience."
            echo "- Choose one of the available [installation methods](https://github.com/brightcraft/moonlight-tizen/wiki/Installation-Guide) and follow the instructions to install the application on your TV."
            echo
            echo "## What's Changed:"
            echo
            if [ -s docs/RELEASE_NOTES_DEV.md ]; then
              cat docs/RELEASE_NOTES_DEV.md
            else
              echo "- No release notes have been provided for this pre-release yet."
            fi
            echo
            echo "- **Commit**: [\`${GITHUB_SHA:0:7}\`](${REPO_URL}/commit/${GITHUB_SHA})"
            if [ -f CHANGELOG.md ]; then
              echo "- **Full Changelog**: [CHANGELOG.md](${REPO_URL}/blob/${GITHUB_SHA}/CHANGELOG.md)"
            fi
            if [ -f docs/S90C-Kurzanleitung.md ]; then
              echo "- **Kurzanleitung**: [docs/S90C-Kurzanleitung.md](${REPO_URL}/blob/${GITHUB_SHA}/docs/S90C-Kurzanleitung.md)"
            fi
            if [ -f docs/S90C-Optimierungsplan.md ]; then
              echo "- **Optimierungsplan**: [docs/S90C-Optimierungsplan.md](${REPO_URL}/blob/${GITHUB_SHA}/docs/S90C-Optimierungsplan.md)"
            fi
            echo
            echo "> [!WARNING]"
            echo "> This is a pre-release build intended for development and testing only."
            echo "> Experimental features, bug fixes, and improvements may be unstable or incomplete."
            echo "> Please report any unexpected behavior and provide feedback to help improve future releases."
          } > release_notes.md
          cat release_notes.md
      # Creates a new GitHub pre-release using the extracted version and the release notes prepared above.
      - name: Create GitHub pre-release
        id: create_prerelease
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.TIMESTAMP }}-${{ env.BRANCH }}
          release_name: "v${{ env.TIMESTAMP }}-${{ env.BRANCH }}"
          body_path: release_notes.md
          draft: false
          prerelease: true
      # Uploads the Moonlight.wgt file as a release asset in the newly created GitHub pre-release.
      - name: Upload the Standard widget file to GitHub pre-release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_prerelease.outputs.upload_url }}
          asset_path: ./Moonlight.wgt
          asset_name: Moonlight.wgt
          asset_content_type: application/octet-stream
      # Uploads the Moonlight-ForceGM.wgt file as a release asset in the newly created GitHub pre-release.
      - name: Upload the ForceGM widget file to GitHub pre-release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_prerelease.outputs.upload_url }}
          asset_path: ./Moonlight-ForceGM.wgt
          asset_name: Moonlight-ForceGM.wgt
          asset_content_type: application/octet-stream
  promote-pre-release:
    if: inputs.promote_tag != ''
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
    # This job turns an existing pre-release into a full release, so that a tested build stays available: the cleanup of
    # the next pre-release of the branch only deletes pre-releases. It keeps the files of the pre-release and moves it to a
    # new tag on the same commit, which the release creates itself (the in-app update check compares the tag with the app
    # version, and the timestamp of a pre-release tag would read as a newer version). The description comes from
    # `docs/RELEASE_NOTES_STABLE.md`.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Promote the pre-release to a full release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          API_URL: ${{ github.api_url }}/repos/${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          api() {
            curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$@"
          }
          for tag in "$PROMOTE_TAG" "$RELEASE_TAG"; do
            if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "Invalid tag: '$tag'"
              exit 1
            fi
          done
          if [ ! -s docs/RELEASE_NOTES_STABLE.md ]; then
            echo "The release notes docs/RELEASE_NOTES_STABLE.md are missing."
            exit 1
          fi

          release=$(api "$API_URL/releases/tags/$PROMOTE_TAG")
          release_id=$(echo "$release" | jq -r '.id')
          if [ "$(echo "$release" | jq -r '.prerelease')" != "true" ]; then
            echo "The release of $PROMOTE_TAG is not a pre-release."
            exit 1
          fi
          # Resolve the commit of the pre-release from its tag (a lightweight tag, or an annotated one pointing to it)
          ref=$(api "$API_URL/git/ref/tags/$PROMOTE_TAG")
          sha=$(echo "$ref" | jq -r '.object.sha')
          if [ "$(echo "$ref" | jq -r '.object.type')" = "tag" ]; then
            sha=$(api "$API_URL/git/tags/$sha" | jq -r '.object.sha')
          fi
          echo "Promoting $PROMOTE_TAG (release $release_id, commit $sha) to $RELEASE_TAG"

          {
            echo "# Moonlight S90C ${RELEASE_TAG}"
            echo
            echo "- Ensure your setup meets the necessary [requirements](https://github.com/brightcraft/moonlight-tizen#%EF%B8%8F-prerequisites) for the best possible streaming experience."
            echo "- Choose one of the available [installation methods](https://github.com/brightcraft/moonlight-tizen/wiki/Installation-Guide) and follow the instructions to install the application on your TV."
            echo
            echo "## What's Changed:"
            echo
            cat docs/RELEASE_NOTES_STABLE.md
            echo
            # The commit link names the build, the documents link the commit these release notes come from
            echo "- **Commit**: [\`${sha:0:7}\`](${REPO_URL}/commit/${sha})"
            echo "- **Full Changelog**: [CHANGELOG.md](${REPO_URL}/blob/${GITHUB_SHA}/CHANGELOG.md)"
            if [ -f docs/S90C-Kurzanleitung.md ]; then
              echo "- **Kurzanleitung**: [docs/S90C-Kurzanleitung.md](${REPO_URL}/blob/${GITHUB_SHA}/docs/S90C-Kurzanleitung.md)"
            fi
            if [ -f docs/S90C-Optimierungsplan.md ]; then
              echo "- **Optimierungsplan**: [docs/S90C-Optimierungsplan.md](${REPO_URL}/blob/${GITHUB_SHA}/docs/S90C-Optimierungsplan.md)"
            fi
          } > release_notes.md
          cat release_notes.md

          # The new tag must not exist on another commit (a rerun finds it on the same commit)
          status=$(curl -sSL -o existing_ref.json -w '%{http_code}' -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" "$API_URL/git/ref/tags/$RELEASE_TAG")
          if [ "$status" = "200" ]; then
            if [ "$(jq -r '.object.sha' existing_ref.json)" != "$sha" ]; then
              echo "The tag $RELEASE_TAG already exists on another commit."
              exit 1
            fi
            echo "The tag $RELEASE_TAG already exists on commit $sha."
          elif [ "$status" != "404" ]; then
            echo "Unexpected status $status while looking up the tag $RELEASE_TAG."
            exit 1
          fi

          # The release creates the new tag on the commit of the pre-release itself. Creating it through the Git refs API
          # is refused for this token (403) when the commit holds workflow files that the default branch doesn't have,
          # while the releases API created the tag of the pre-release on the same commit.
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$sha" --arg name "Moonlight S90C ${RELEASE_TAG}" --rawfile body release_notes.md \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}' \
            | api -X PATCH "$API_URL/releases/$release_id" --data @- > /dev/null
          echo "Turned the pre-release into the full release $RELEASE_TAG."
          if [ "$(api "$API_URL/git/ref/tags/$RELEASE_TAG" | jq -r '.object.sha')" != "$sha" ]; then
            echo "The tag $RELEASE_TAG doesn't point to commit $sha. The tag $PROMOTE_TAG is kept."
            exit 1
          fi

          # The old tag of the pre-release is no longer used by any release
          api -X DELETE "$API_URL/git/refs/tags/$PROMOTE_TAG" > /dev/null
          echo "Deleted the tag $PROMOTE_TAG."

          api "$API_URL/releases/$release_id" \
            | jq '{html_url, tag_name, name, prerelease, draft, assets: [.assets[] | {name, size}]}'
